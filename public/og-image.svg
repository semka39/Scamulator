<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#1c1917" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="flameAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Flame Icon Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Dark Canvas -->
  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="600" cy="220" r="280" fill="url(#flameAura)" />

  <!-- Central Flame Emblem Badge -->
  <g transform="translate(530, 100)">
    <!-- Badge Box -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="#141415" stroke="url(#borderGrad)" stroke-width="3.5" />
    
    <!-- Big Glowing Flame (Scaled to 140x140) -->
    <g transform="translate(30, 22) scale(2.3)">
      <path d="M17.5 4C17.5 4 19 8 23 12C25.5 14.5 27 18 27 22C27 27.523 22.523 32 17 32C11.477 32 7 27.523 7 22C7 17.5 9.5 14 13 11C13 11 14 7 17.5 4Z" 
            fill="url(#goldGrad)" />
      <!-- Inner Core White/Yellow Highlight -->
      <path d="M17 30C14.239 30 12 27.761 12 25C12 22.5 13.5 20.5 15.5 19C17 21 18.5 22 20 24C21.5 26 21 28 19.5 29.2C18.8 29.7 17.9 30 17 30Z" 
            fill="#ffffff" fill-opacity="0.85" />
    </g>
  </g>

  <!-- Brand Title -->
  <text x="600" y="325" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#goldGrad)" 
        text-anchor="middle">
    SCAMULATOR
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="380" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#e5e5e5" 
        text-anchor="middle">
    СИМУЛЯТОР СХЕМ И АЛГОРИТМИЧЕСКИХ ПУЛОВ
  </text>

  <!-- Description snippet -->
  <text x="600" y="425" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="18" 
        font-weight="400" 
        letter-spacing="0.5" 
        fill="#a3a3a3" 
        text-anchor="middle">
    Создавайте собственные смарт-контракты или инвестируйте в пулы других темщиков
  </text>

  <!-- Interactive Badges Row -->
  <g transform="translate(600, 500)">
    <!-- Badge 1: Sandbox -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="190" height="46" rx="23" fill="url(#badgeGrad)" stroke="#404040" stroke-width="1.5" />
      <circle cx="26" cy="23" r="6" fill="#10b981" />
      <text x="44" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f5f5">JS SANDBOX 2.0</text>
    </g>

    <!-- Badge 2: Smart Pools -->
    <g transform="translate(-105, 0)">
      <rect x="0" y="0" width="210" height="46" rx="23" fill="url(#badgeGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="105" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">🔥 СМАРТ-ПУЛЫ</text>
    </g>

    <!-- Badge 3: Leaderboard -->
    <g transform="translate(130, 0)">
      <rect x="0" y="0" width="190" height="46" rx="23" fill="url(#badgeGrad)" stroke="#404040" stroke-width="1.5" />
      <text x="95" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f5f5" text-anchor="middle">⚡ ЛИДЕРБОРД</text>
    </g>
  </g>

  <!-- Bottom corner copyright / brand watermark -->
  <text x="60" y="565" font-family="monospace" font-size="13" fill="#525252">TEMSHCHIK PROTOCOL v2.5</text>
  <text x="1140" y="565" font-family="monospace" font-size="13" fill="#525252" text-anchor="end">HIGH-RISK FINANCIAL SIM</text>
</svg>
